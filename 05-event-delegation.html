<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>05 - Event Delegation</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    ul { list-style: none; padding: 0; max-width: 400px; }
    li { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px 15px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    .input-group { margin-bottom: 15px; display: flex; gap: 8px; max-width: 400px; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .add-btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>05: Event Delegation (1 Listener for Multiple Items)</h2>
  <p>Instead of attaching event listeners to every single <code>&lt;li&gt;</code> or delete button, we attach <strong>ONE single listener to the parent <code>&lt;ul&gt;</code></strong>.</p>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="New task name...">
    <button id="addBtn" class="add-btn">Add Item</button>
  </div>

  <ul id="taskList">
    <li><span>Buy Groceries</span> <button class="delete-btn">Delete</button></li>
    <li><span>Finish Project</span> <button class="delete-btn">Delete</button></li>
  </ul>

  <script>
    const taskList = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');

    // 1. EVENT DELEGATION: Attached to parent <ul> once!
    taskList.addEventListener('click', (e) => {
      // e.target refers to the EXACT element clicked inside the <ul>
      
      // If user clicked a delete button
      if (e.target.classList.contains('delete-btn')) {
        const li = e.target.parentElement;
        li.remove();
        console.log('Item removed via delegation!');
      }

      // If user clicked the text of an item
      if (e.target.tagName === 'SPAN') {
        e.target.style.textDecoration = e.target.style.textDecoration === 'line-through' ? 'none' : 'line-through';
      }
    });

    // 2. Adding NEW items dynamically
    addBtn.addEventListener('click', () => {
      const text = taskInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.innerHTML = `<span>${text}</span> <button class="delete-btn">Delete</button>`;
      taskList.appendChild(li);

      // NOTICE: We do NOT need to attach any event listener to the new button!
      // Event delegation on the parent <ul> automatically handles it!
      taskInput.value = '';
    });
  </script>
</body>
</html>
