<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>03 - Event Object & preventDefault</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { background: #f1f5f9; padding: 20px; border-radius: 8px; max-width: 350px; border: 1px solid #cbd5e1; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    a { color: #2563eb; display: inline-block; margin-top: 15px; }
    .output { margin-top: 15px; padding: 10px; background: #e0f2fe; color: #0369a1; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h2>03: The Event Object & preventDefault()</h2>

  <!-- Form Submission Demo -->
  <form id="loginForm">
    <h3>Sign In</h3>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="user@example.com">
    </div>
    <button type="submit">Submit Form</button>
  </form>

  <div id="formResult" class="output"></div>

  <!-- Link Click Intercept Demo -->
  <a href="https://example.com" id="customLink">Click to visit example.com (Intercepted)</a>

  <script>
    // 1. Submit Event + e.preventDefault()
    const form = document.getElementById('loginForm');
    const resultBox = document.getElementById('formResult');

    form.addEventListener('submit', (e) => {
      // PREVENT DEFAULT: Stops the browser from refreshing or navigating away on submit!
      e.preventDefault();

      // Accessing details from the Event Object 'e'
      console.log('Event Type:', e.type);        // 'submit'
      console.log('Event Target:', e.target);    // <form id="loginForm">

      const emailVal = document.getElementById('email').value;
      resultBox.style.display = 'block';
      resultBox.innerHTML = `<strong>Form submitted cleanly without page refresh!</strong><br>Email: ${emailVal}`;
    });

    // 2. Link Interception + e.preventDefault()
    const link = document.getElementById('customLink');
    link.addEventListener('click', (e) => {
      e.preventDefault(); // Stops the link from opening the URL!
      alert(`Intercepted link click to: ${e.target.href}
Page navigation was cancelled by e.preventDefault()!`);
    });
  </script>
</body>
</html>
